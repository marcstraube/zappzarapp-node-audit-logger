# CI disabled by default — remove workflow block to enable for self-hosted GitLab
workflow:
  rules:
    - when: never

image: node:22

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SAST_EXCLUDED_PATHS: "node_modules/,dist/,coverage/,reports/,tests/"

stages:
  - verify
  - test
  - security

cache:
  paths:
    - node_modules/
    - .pnpm-store/

gpg-verify:
  stage: verify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  rules:
    - if: $CI_MERGE_REQUEST_IID
  script:
    - |
      echo "Verifying GPG signatures for MR !$CI_MERGE_REQUEST_IID"
      FAILED=0
      TOTAL=0
      for SHA in $(curl -sf --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/commits?per_page=100" \
        | jq -r '.[].id'); do
        TOTAL=$((TOTAL + 1))
        STATUS=$(curl -sf --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$SHA/signature" 2>/dev/null \
          | jq -r '.verification_status // "unsigned"') || STATUS="unsigned"
        if [ "$STATUS" != "verified" ]; then
          FAILED=$((FAILED + 1))
          echo "  UNSIGNED: ${SHA:0:7} ($STATUS)"
        fi
      done
      if [ "$FAILED" -gt 0 ]; then
        echo "ERROR: $FAILED of $TOTAL commit(s) are not GPG-signed"
        exit 1
      fi
      echo "All $TOTAL commit(s) are GPG-signed"

.node-setup: &node-setup
  before_script:
    - corepack enable
    - corepack prepare pnpm@10 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

format:
  <<: *node-setup
  stage: test
  script:
    - pnpm run format:check

lint:
  <<: *node-setup
  stage: test
  script:
    - pnpm run lint

typecheck:
  <<: *node-setup
  stage: test
  script:
    - pnpm run typecheck

test:
  <<: *node-setup
  stage: test
  script:
    - pnpm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 hour

build:
  <<: *node-setup
  stage: test
  script:
    - pnpm run build
    - test -d dist

security:
  <<: *node-setup
  stage: security
  script:
    - pnpm audit --prod --audit-level=moderate

depcruise:
  <<: *node-setup
  stage: test
  script:
    - pnpm depcruise

mutation:
  <<: *node-setup
  stage: test
  needs: [test]
  script:
    - pnpm run mutation
  artifacts:
    paths:
      - reports/mutation/
    expire_in: 1 week
    when: always

sbom:
  <<: *node-setup
  stage: security
  script:
    - pnpm run sbom
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 1 week
